version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lp_postgres
    environment:
      POSTGRES_USER: lp_user
      POSTGRES_PASSWORD: lp_pass
      POSTGRES_DB: lp_hubspot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lp_user -d lp_hubspot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
